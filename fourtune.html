    <h1>FOURTUNE TELLER</h1>
       <img src="./images/teller.png" width = 200 height = 200>



        <form method="get">
        <p></p>
         Email Address You Would Like Us To Send Your Fourtune To: <input type="email" name="Email" id="email" placeholder="name@email.com">

         <p></p>
        What Would You Like Us To Predict?  <input type="text"  name="four" id="text" placeholder = "Choose Wisley">

          <p>How Old are you?</p>

         Over 18 <input type="radio" name="Over18" id="over18" value="over18">


          <p>What is your gender?</p>
          <select name="gender">
            <option value="gender">Please Enter Gender</option>
            <option value="M">Male</option>
            <option value="F">Female</option>
               <option value="nogender">Prefer Not To Say</option>
          </select>

          <p></p>
          <input type="submit" name="submitted" value="Receive Fourtune">



   </form>
